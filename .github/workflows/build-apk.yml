name: Build OwpenGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          if [ ! -f cmdline-tools.zip ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          fi
          rm -rf $ANDROID_HOME/cmdline-tools/latest
          unzip -q -o cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | timeout 300 sdkmanager --licenses > /dev/null 2>&1 || true
          yes | timeout 600 sdkmanager --install "platform-tools" "ndk;21.4.7075529" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" > /dev/null 2>&1 || true
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK dir empty"

      - name: Show gradle build environment
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== gradle.properties ==="
          cat gradle.properties
          echo "=== TMessagesProj/build.gradle (first 100) ==="
          head -100 TMessagesProj/build.gradle
          echo "=== TMessagesProj_App/build.gradle (first 100) ==="
          head -100 TMessagesProj_App/build.gradle

      - name: Set local.properties
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          cat local.properties

      - name: Add NDK version to gradle.properties
        run: |
          grep -q "android.ndkVersion" gradle.properties || echo "android.ndkVersion=21.4.7075529" >> gradle.properties
          grep -q "org.gradle.jvmargs" gradle.properties || echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties

      - name: Build Debug APK (show full error)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info > /tmp/gradle-build.log 2>&1
          BUILD_EXIT=$?
          echo "=== BUILD EXIT CODE: $BUILD_EXIT ==="
          echo "=== LAST 200 LINES OF BUILD LOG ==="
          tail -200 /tmp/gradle-build.log
          echo "=== ERRORS ==="
          grep -E "error:|ERROR|What went wrong|FAILED|FAILURE" /tmp/gradle-build.log | head -50
          echo "=== BUILD END ==="
          exit $BUILD_EXIT

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
