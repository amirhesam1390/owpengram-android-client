name: Build OwpenGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "ndk;21.4.7075529" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"
          echo "y" | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Set local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Add NDK version to gradle.properties
        run: |
          if ! grep -q "android.ndkVersion" gradle.properties; then
            echo "android.ndkVersion=21.4.7075529" >> gradle.properties
          fi
          if ! grep -q "org.gradle.jvmargs" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          fi
          if ! grep -q "android.useAndroidX" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
